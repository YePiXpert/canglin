[project]
name = "canglin-ocr"
version = "2.0.0"
description = "OA 采购单据解析微服务（PDF 文本层 + PaddleOCR 兜底）"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "python-multipart>=0.0.12",
    "pdfplumber>=0.11",
    "pypdfium2>=4.30",
    "pillow>=10.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
# PaddleOCR 体积大（含 paddlepaddle），仅生产/Docker 安装
paddle = [
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
]
dev = [
    "pytest>=8",
    "httpx>=0.27",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
