<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f8f6f1" />
    <script>
      // 防 FOUC：首帧前按本地偏好预置 .dark（与 src/stores/theme.ts 的 STORAGE_KEY 保持一致）
      try {
        var t = localStorage.getItem('canglin-theme');
        if (t === 'dark' || (t !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark');
        }
      } catch (e) { /* localStorage 不可用时退回浅色 */ }
    </script>
    <meta name="description" content="办公用品采购与领用：OA 单导入、分次采购、到货入库、库存领用" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- iOS 主屏图标（scripts/render-icons.mjs 生成）：朱砂底铺满、白色仓门标志，系统自己切圆角 -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>仓廪 · 采购与领用</title>
    <style>
      /* 首屏占位：路由守卫要等 /auth/status 回来才渲染，没有这段就是一片白。颜色与 main.css 令牌一致 */
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        background: #f8f6f1;
        font-family: "Segoe UI Variable Text", "Segoe UI", -apple-system, "PingFang SC", "Hiragino Sans GB",
          "Microsoft YaHei UI", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif;
        -webkit-font-smoothing: antialiased;
      }
      /* 与顶栏、浏览器图标共用一份仓门标志。 */
      #boot .mark { display: block; width: 40px; height: 40px; }
      #boot .spin {
        width: 18px;
        height: 18px;
        border: 2px solid rgba(26, 25, 21, 0.12);
        border-top-color: #1a1915;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot p {
        margin: 0;
        color: #6b665c;
        font-size: 13px;
      }
      html.dark #boot {
        background: #141311;
      }
      html.dark #boot .spin {
        border-color: rgba(242, 239, 232, 0.14);
        border-top-color: #f2efe8;
      }
      html.dark #boot p {
        color: #a39e93;
      }
      @keyframes boot-spin {
        to { transform: rotate(360deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .spin { animation-duration: 2s; }
      }
      /* 应用挂载后由 main.ts 移除 */
      .app-ready #boot { display: none; }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="boot">
      <img class="mark" src="/favicon.svg" width="48" height="48" alt="" aria-hidden="true" />
      <div class="spin"></div>
      <p>正在启动仓廪…</p>
    </div>
    <noscript>
      <p style="padding: 24px; font-family: system-ui, sans-serif; color: #1a1915">
        本系统需要启用 JavaScript 才能使用。
      </p>
    </noscript>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
