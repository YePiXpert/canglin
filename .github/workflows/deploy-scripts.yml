name: Deployment scripts

on:
  push:
    branches: [main]
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-scripts.yml'
  pull_request:
    paths:
      - 'deploy/**'
      - '.github/workflows/deploy-scripts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deployment-paths:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash -n deploy/deploy.sh deploy/upgrade.sh deploy/rollback.sh deploy/trial.sh deploy/storage.sh
      - run: python3 -m unittest discover -s deploy/tests -v
