name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 前端（构建 + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # 版本取自根 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canglin/shared build
      - run: pnpm --filter @canglin/web typecheck
      - run: pnpm --filter @canglin/web lint
      - run: pnpm --filter @canglin/web test
      - run: pnpm --filter @canglin/web build

  server:
    name: 服务端（构建 + 测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # 版本取自根 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canglin/shared build
      - run: pnpm --filter @canglin/server exec prisma generate
      - run: pnpm --filter @canglin/server typecheck
      - run: pnpm --filter @canglin/server lint
      - run: pnpm --filter @canglin/server test
      - run: pnpm --filter @canglin/server build
      - run: pnpm --filter @canglin/web exec playwright install --with-deps chromium
      - run: pnpm --filter @canglin/web test:e2e
      - run: python3 -m unittest discover -s deploy/tests -v
      - run: python3 -m unittest discover -s scripts/tests -v

  visual:
    name: 视觉回归（Playwright 容器）
    runs-on: ubuntu-latest
    # 与 apps/web/scripts/visual.sh 同一个镜像：浏览器与中文字体由镜像决定，基线只在这里比较。
    # 镜像版本要和 pnpm-lock.yaml 里的 @playwright/test 一致，升级 Playwright 时一起改并重建基线。
    container:
      image: mcr.microsoft.com/playwright:v1.64.0-noble
      options: --ipc=host
    steps:
      # 中文字体与 scripts/visual.sh 一致：镜像自带的文泉驿正黑没有粗体
      - run: apt-get update && apt-get install -y --no-install-recommends fonts-noto-cjk
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4   # 版本取自根 package.json 的 packageManager
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @canglin/shared build
      - run: pnpm --filter @canglin/server build
      - run: pnpm --filter @canglin/web test:visual
      - name: 上传差异图
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-diff
          path: apps/web/test-results
          retention-days: 7

  ocr:
    name: OCR 解析服务（测试）
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: 安装轻依赖
        working-directory: apps/ocr
        run: pip install -e ".[dev]"
      - name: 运行测试（无需 PaddleOCR）
        working-directory: apps/ocr
        run: pytest -v

  ocr-runtime:
    name: OCR 真实模型与离线资源测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f deploy/Dockerfile.ocr -t canglin-ocr:runtime-test .
      - run: docker build -f deploy/Dockerfile.ocr-test -t canglin-ocr:test .
      - run: docker run --rm --network none --cpus 2 --memory 4g canglin-ocr:test
      - run: docker run --rm --network none --cpus 2 --memory 4g canglin-ocr:test python -m tests.smoke_engine

  docker:
    name: 镜像（${{ matrix.name }}）构建并推送 GHCR
    runs-on: ubuntu-latest
    needs: [web, server, visual, ocr, ocr-runtime]
    # PR 只验证构建不推送；push / 手动触发推送 ghcr.io
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: deploy/Dockerfile.web
          - name: server
            dockerfile: deploy/Dockerfile.server
          - name: ocr
            dockerfile: deploy/Dockerfile.ocr
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: 计算镜像标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/canglin-${{ matrix.name }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: SOURCE_REVISION=${{ github.sha }}
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # GHA 构建缓存：OCR 镜像数 GB，命中缓存后增量构建只需几分钟
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max
