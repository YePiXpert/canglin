name: procure-lite

# 镜像优先从 GHCR 拉取（CI 自动构建推送）；
# 若无法访问 GHCR 或需要本地改动，docker compose up --build 走本地构建
services:
  web:
    image: ghcr.io/yepixpert/procure-lite-web:${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      - server
    restart: unless-stopped

  server:
    image: ghcr.io/yepixpert/procure-lite-server:${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.server
    environment:
      # 服务器时区：每日 3 点的维护任务和本地日期按它计算
      TZ: ${TZ:-Asia/Shanghai}
      DATA_DIR: /app/state
      DATABASE_URL: file:/app/state/procure.db
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${OCR_API_KEY:-please-change-ocr-key}
      # AI 首次默认值（可选）；运行时配置存数据库，可在设置页修改
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
    volumes:
      - procure-state:/app/state
    depends_on:
      - ocr
    restart: unless-stopped

  ocr:
    image: ghcr.io/yepixpert/procure-lite-ocr:${RELEASE_TAG:-latest}
    build:
      context: .
      dockerfile: deploy/Dockerfile.ocr
    environment:
      TZ: ${TZ:-Asia/Shanghai}
      OCR_API_KEY: ${OCR_API_KEY:-please-change-ocr-key}
      OCR_MAX_CONCURRENT: "1"
      OCR_CPU_THREADS: "2"
      OCR_MAX_PAGES: "30"
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-API-Key':os.environ['OCR_API_KEY']}),timeout=90).read()"]
      interval: 30s
      timeout: 95s
      start_period: 120s
      retries: 3
    restart: unless-stopped

volumes:
  procure-state:
