# Fixed candidate b10744b109e8904ef4d443b39741b47051db8600.
# Standalone file: never merge with the production Compose configuration.
name: procure-lite-trial-b10744b
services:
  web:
    image: ghcr.io/yepixpert/procure-lite-web@sha256:b19d1ae1fce05e1486305518150ea0b531b4858034d3d114aecca69b08e3d4c2
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - server
    cpus: 0.25
    mem_limit: 128m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  server:
    image: ghcr.io/yepixpert/procure-lite-server@sha256:3b89915e58ef56bb9c0501c8f8273c3bf7cae05cfdb9c03bca58e933110a147d
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/state
      DATABASE_URL: file:/app/state/procure.db
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: ""
      LLM_MODEL: ""
    volumes:
      - trial-state:/app/state
    depends_on:
      - ocr
    cpus: 1
    mem_limit: 1g
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  ocr:
    image: ghcr.io/yepixpert/procure-lite-ocr@sha256:6bd11b130f02a6bc90ca875cecfdbd80ab5662f3ec52b40bad789008f2753c3f
    environment:
      TZ: Asia/Shanghai
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      OCR_MAX_CONCURRENT: "1"
      OCR_CPU_THREADS: "2"
      OCR_MAX_PAGES: "30"
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-API-Key':os.environ['OCR_API_KEY']}),timeout=90).read()"]
      interval: 30s
      timeout: 95s
      start_period: 120s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
volumes:
  trial-state:
