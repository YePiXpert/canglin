# Fixed candidate b92d162ff737699f742c359e79ad4d265f940531.
# Standalone file: never merge with the production Compose configuration.
name: canglin-trial-b92d162
services:
  web:
    image: ghcr.io/yepixpert/canglin-web@sha256:a4358c384ac15fd9dd8178a8120e88d056af3f9e809c5805581ec97908e7c321
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - server
    cpus: 0.25
    mem_limit: 128m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  server:
    image: ghcr.io/yepixpert/canglin-server@sha256:fb0de831397b03af8c52cac6e5ed7ad5ed6448bfd8f67eeb21a837b72617020d
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/state
      DATABASE_URL: file:/app/state/canglin.db
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: ""
      LLM_MODEL: ""
    volumes:
      - trial-state:/app/state
    depends_on:
      - ocr
    cpus: 1
    mem_limit: 1g
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  ocr:
    image: ghcr.io/yepixpert/canglin-ocr@sha256:3a7660a71a4e2cffe666b4c5e260cefe1629606280e4448fd2440c6cf647686d
    environment:
      TZ: Asia/Shanghai
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      OCR_MAX_CONCURRENT: "1"
      OCR_CPU_THREADS: "2"
      OCR_MAX_PAGES: "30"
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-API-Key':os.environ['OCR_API_KEY']}),timeout=90).read()"]
      interval: 30s
      timeout: 95s
      start_period: 120s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
volumes:
  trial-state:
