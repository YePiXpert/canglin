# Images and revision are pinned together in trial-candidate.env.
# Standalone file: never merge with the production Compose configuration.
name: canglin-trial
services:
  web:
    image: ${TRIAL_WEB_IMAGE:?Run deploy/trial.sh}
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - server
    cpus: 0.25
    mem_limit: 128m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  server:
    image: ${TRIAL_SERVER_IMAGE:?Run deploy/trial.sh}
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/state
      DATABASE_URL: file:/app/state/canglin.db
      TRUST_PROXY_HOPS: "1"
      TRUST_PROXY_CIDRS: "172.16.0.0/12"
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: ""
      LLM_MODEL: ""
    volumes:
      - trial-state:/app/state
    depends_on:
      - ocr
    cpus: 1
    mem_limit: 1g
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  ocr:
    image: ${TRIAL_OCR_IMAGE:?Run deploy/trial.sh}
    environment:
      TZ: Asia/Shanghai
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      OCR_MAX_CONCURRENT: "1"
      OCR_CPU_THREADS: "2"
      OCR_MAX_PAGES: "30"
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-API-Key':os.environ['OCR_API_KEY']}),timeout=90).read()"]
      interval: 30s
      timeout: 95s
      start_period: 120s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
volumes:
  trial-state:
