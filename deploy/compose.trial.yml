# Fixed candidate 42b9ae68367e7b9ea27c34b8d6627049728b990b.
# Standalone file: never merge with the production Compose configuration.
name: canglin-trial-42b9ae6
services:
  web:
    image: ghcr.io/yepixpert/canglin-web@sha256:7111f99de24b9cb76f10ddf2dc6ed6099e74f98ad3e7b5afce440637b57ad20f
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - server
    cpus: 0.25
    mem_limit: 128m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  server:
    image: ghcr.io/yepixpert/canglin-server@sha256:cb912964c4e23823cc79ce4855ebb63eea031d0a78b5483e02954bdb23ed1fb6
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/state
      DATABASE_URL: file:/app/state/canglin.db
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: ""
      LLM_MODEL: ""
    volumes:
      - trial-state:/app/state
    depends_on:
      - ocr
    cpus: 1
    mem_limit: 1g
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  ocr:
    image: ghcr.io/yepixpert/canglin-ocr@sha256:22ef72757b91e5540bff3c20b2fef6418f0eb709fd6f84cf0dc1daf6c53b9069
    environment:
      TZ: Asia/Shanghai
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      OCR_MAX_CONCURRENT: "1"
      OCR_CPU_THREADS: "2"
      OCR_MAX_PAGES: "30"
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-API-Key':os.environ['OCR_API_KEY']}),timeout=90).read()"]
      interval: 30s
      timeout: 95s
      start_period: 120s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
volumes:
  trial-state:
