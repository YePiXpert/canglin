# Fixed candidate ce8fe2ef40f7d0e4f482335ead0143716e3e9478.
# Standalone file: never merge with the production Compose configuration.
name: canglin-trial-ce8fe2e
services:
  web:
    image: ghcr.io/yepixpert/canglin-web@sha256:8f84f3fbb4aa0c98d75730d7d417aa3bfa7611ae92772d973d2a70dd480eb637
    ports:
      - "127.0.0.1:18080:80"
    depends_on:
      - server
    cpus: 0.25
    mem_limit: 128m
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  server:
    image: ghcr.io/yepixpert/canglin-server@sha256:8014bd05fefa14478295c6cb579b2feaa66db6f474f91ba8b1cc0583b2dfdad1
    environment:
      TZ: Asia/Shanghai
      DATA_DIR: /app/state
      DATABASE_URL: file:/app/state/procure.db
      OCR_BASE_URL: http://ocr:8000
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      LLM_BASE_URL: ""
      LLM_API_KEY: ""
      LLM_API_KEY_FILE: ""
      LLM_MODEL: ""
    volumes:
      - trial-state:/app/state
    depends_on:
      - ocr
    cpus: 1
    mem_limit: 1g
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
  ocr:
    image: ghcr.io/yepixpert/canglin-ocr@sha256:35a8eb20bbc51bf100fcd8529f301ba8d6b622c36dbac9bab86356afedcca82d
    environment:
      TZ: Asia/Shanghai
      OCR_API_KEY: ${TRIAL_OCR_API_KEY:?Run deploy/trial.sh up first}
      OCR_MAX_CONCURRENT: "1"
      OCR_CPU_THREADS: "2"
      OCR_MAX_PAGES: "30"
    cpus: 2
    mem_limit: 4g
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/ready',headers={'X-API-Key':os.environ['OCR_API_KEY']}),timeout=90).read()"]
      interval: 30s
      timeout: 95s
      start_period: 120s
      retries: 3
    labels:
      com.centurylinklabs.watchtower.enable: "false"
    restart: "no"
volumes:
  trial-state:
